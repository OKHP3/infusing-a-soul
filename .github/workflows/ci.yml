name: App checks

on:
  workflow_call:
    inputs:
      prepare-pages:
        description: Prepare a Pages artifact only after verification succeeds
        type: boolean
        required: false
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-contributor-tests:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - name: Check lockfile portability
        run: npm run check:lockfile-portability
      - name: Test contributor utilities on Windows
        run: node --test tests/generate-public-content.test.mjs tests/lockfile-portability.test.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          cache: npm
      - name: Check lockfile portability before downloading packages
        run: npm run check:lockfile-portability
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org
      - name: Test lockfile portability guard
        run: npm run test:lockfile
      - name: Type check
        run: npm run check
      - name: Test public content generator
        run: npm run test:content
      - name: Build
        run: npm run build
      - name: Install Chromium, Firefox, and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test browser workbench
        run: npm run test:browser
      - name: Prepare verified Pages artifact
        if: inputs.prepare-pages == true
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Preserve browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
